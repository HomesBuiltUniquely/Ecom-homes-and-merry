spring:
  profiles:
    active: dev

  application:
    name: "Homes-merry"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: "com.mysql.cj.jdbc.Driver"

  jpa:
    hibernate:
      ddl-auto: "validate"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: "org.hibernate.dialect.MySQLDialect"

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
