name: Backend CI - Build & Package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build Spring Boot App (Java 17)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Temurin) with automatic Maven dependency caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Ensure Maven wrapper script has execution permissions on Linux runner
      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      # Step 4: Compile source code, run MapStruct annotation processing, and package JAR
      - name: Build & Package with Maven
        run: ./mvnw clean package -DskipTests

      # Step 5: Save compiled JAR artifact for deployment pipelines
      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/Homes-merry-0.0.1-SNAPSHOT.jar
          retention-days: 7
